<text x="1260" y="325" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">Місткість</text>
<text x="1615" y="325" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#25332e">2 дорослих / 1 поверх</text>
<text x="1260" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">Зовнішній габарит</text>
<text x="1615" y="390" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#25332e">6,40 × 6,00 м</text>
<text x="1260" y="455" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">У зовнішньому контурі</text>
<text x="1615" y="455" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#25332e">38,40 м²</text>
<text x="1260" y="520" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">Чиста площа приміщень</text>
<text x="1615" y="520" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#25332e">31,92 м²</text>
<text x="1260" y="585" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">01 · Відкрита студія</text>
<text x="1615" y="585" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#25332e">27,30 м²</text>
<text x="1260" y="650" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">02 · Санвузол</text>
<text x="1615" y="650" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#25332e">4,62 м²</text>
<text x="1260" y="715" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">03 · Тераса</text>
<text x="1615" y="715" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#25332e">6,40 × 3,20 = 20,48 м²</text>
<text x="1260" y="815" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#25624d">ПРОПОЗИЦІЯ РОЗТАШУВАННЯ</text>
<text x="1260" y="870" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#25332e">Тераса поглиблена: пропозиція 3,20 м.</text>
<text x="1260" y="913" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#25332e">Зліва — стільниця та електрогриль*.</text>
<text x="1260" y="956" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#25332e">Справа — SPA, посередині — прохід.</text>
<text x="1260" y="999" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#25332e">Квадратний столик і два крісла.</text>
<text x="1260" y="1042" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#25332e">Внутрішнє планування залишене як у №04.</text>
<text x="1260" y="1120" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#25624d">ЩО ЩЕ ПЕРЕВІРИТИ</text>
<text x="1260" y="1175" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">* Тільки модель для вбудовування надворі.</text>
<text x="1260" y="1217" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">Відступи й вентиляція — за її інструкцією.</text>
<text x="1260" y="1259" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">Негорючий модуль та відповідна основа.</text>
<text x="1260" y="1301" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">Електрозахист і сусідство зі SPA — перевірити.</text>
<text x="1260" y="1343" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">Гриль показано без накриття над ним.</text>
<text x="1260" y="1385" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">Вугільний мангал тут не передбачено.</text>
<text x="1260" y="1427" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">Це ескіз; безпеку монтажу не підтверджено.</text>
<text x="180" y="1900" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#25332e">Розміри в мм. Геометрія побудована в масштабі; при друці використовувати розмірні числа.</text>
<text x="180" y="1940" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#25332e">Погоджуємо тільки ескіз і розташування меблів. Деталізація та розрахунки — наступним етапом.</text>
