<text x="1260" y="913" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#25332e">Ліжко 180 × 200 см; без окремої спальні.</text>
<text x="1260" y="956" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#25332e">Шафа 2220 × 600 уздовж стіни санвузла.</text>
<text x="1260" y="999" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#25332e">Стіл із кріслами ближче до вікна.</text>
<text x="1260" y="1042" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#25332e">Прохід до тераси — по центру студії.</text>
<text x="1260" y="1120" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#25624d">ЩО ЩЕ ПЕРЕВІРИТИ</text>
<text x="1260" y="1175" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">Стіни 250 мм і перегородки 120 мм —</text>
<text x="1260" y="1217" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">умовні; конструкцію визначає проєктант.</text>
<text x="1260" y="1259" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">* Проходи перевірити з моделями меблів.</text>
<text x="1260" y="1301" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">Вхід у студію: рішення без окремого тамбура.</text>
<text x="1260" y="1343" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">Вентиляція, гаряча вода, опалення, дренаж.</text>
<text x="1260" y="1385" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">Основа SPA, доступ для сервісу й приватність.</text>
<text x="1260" y="1427" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#25332e">Резерв Ø1850 не задає конкретну модель.</text>
<text x="180" y="1690" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#25332e">Розміри в мм. Геометрія побудована в масштабі; при друці використовувати розмірні числа.</text>
<text x="180" y="1730" dominant-baseline="text-before-edge" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#25332e">Ескіз для погодження та запиту ціни. Робочі креслення, конструкції й інженерія розробляються окремо.</text>
