<text x="1170" y="577" font-size="14" fill="#24352c" text-anchor="start" font-weight="400">4 окремі крісла</text>
<text x="1170" y="609" font-size="14" fill="#24352c" text-anchor="start" font-weight="400">Один суцільний дашок</text>
<text x="1170" y="641" font-size="14" fill="#24352c" text-anchor="start" font-weight="400">Відкритий передній край</text>
<text x="1170" y="673" font-size="14" fill="#24352c" text-anchor="start" font-weight="400">Мангал збоку</text>
<text x="1170" y="705" font-size="14" fill="#24352c" text-anchor="start" font-weight="400">2 малі килимки спальні</text>
<text x="1170" y="804" font-size="13" fill="#24352c" text-anchor="start" font-weight="700">УМОВНІ ПОЗНАЧЕННЯ</text>
<line x1="1170" y1="830" x2="1220" y2="830" stroke="#83977d" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1170" y="852" font-size="12" fill="#68756b" text-anchor="start" font-weight="400">контур дашка над терасою</text>
<line x1="1170" y1="880" x2="1220" y2="880" stroke="#6b9d99" stroke-width="2" />
<text x="1170" y="902" font-size="12" fill="#68756b" text-anchor="start" font-weight="400">вікна / скляний вихід</text>
</g>
<line x1="70" y1="1320" x2="1370" y2="1320" stroke="#d0d6ca" stroke-width="1" />
<text x="70" y="1353" font-size="16" fill="#68756b" text-anchor="start" font-weight="400">* Габарит 7 × 7 м і тераса 7 × 3 м — робочі припущення з попередньої концепції, потребують погодження.</text>
<text x="70" y="1381" font-size="16" fill="#68756b" text-anchor="start" font-weight="400">Схема розміщення для обговорення. Розміри меблів, проходи й конструктив — уточнити на обмірному плані.</text>
