    <!-- angular outer mane with curled upper locks -->
    <path d="M22 22c-3-3-7-2-8 1l4 3-6 7h4v13l5-5v8l5-4 3 7 3 3 3-3 3-7 5 4v-8l5 5V33h4l-6-7 4-3c-1-3-5-4-8-1"/>

    <!-- geometric face -->
    <path d="M23 24h18l3 4v15l-5 5-7 4-7-4-5-5V28Z"/>

    <!-- eyes -->
    <path d="m26 34 3 2m9-2-3 2"/>
  </g>

  <!-- nose and muzzle -->
  <path d="m28 41 4-2 4 2-4 5Z" fill="#000"/>
  <path d="M26 47c1 6 4 7 6 7s5-1 6-7l-6 3Z" fill="#fff" stroke="#000" stroke-width="3.5" stroke-linejoin="round"/>
