<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;height:160px;box-sizing:border-box"><div class="lp-dots" style="border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--stone)">.lp-dots</div><div style="border-radius:12px;background:var(--forest);display:grid;grid-template-columns:repeat(4,1fr)"><span style="border-right:1px solid rgba(242,237,227,.18);display:grid;place-items:end start;padding:10px;font-family:var(--font-num);color:rgba(242,237,227,.5);font-size:26px">01</span><span style="border-right:1px solid rgba(242,237,227,.18);display:grid;place-items:end start;padding:10px;font-family:var(--font-num);color:rgba(242,237,227,.5);font-size:26px">02</span><span style="border-right:1px solid rgba(242,237,227,.18);display:grid;place-items:end start;padding:10px;font-family:var(--font-num);color:rgba(242,237,227,.5);font-size:26px">03</span><span style="border-right:0;display:grid;place-items:end start;padding:10px;font-family:var(--font-num);color:rgba(242,237,227,.5);font-size:26px">04</span></div><div style="border-radius:12px;background:var(--linen-2);display:grid;place-items:center"><span style="width:84px;height:120px;border-radius:50% 50% 8px 8px;border:1.5px solid var(--ochre);background:url(../assets/imagery/cabin-forest.png) 60% center/cover"></span></div></div></body></html>
