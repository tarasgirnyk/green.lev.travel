<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)}</style></head><body><div style="padding:26px;display:flex;gap:26px;background:var(--linen)"><div style="flex:1;height:90px;border-radius:14px;background:var(--paper);box-shadow:var(--shadow-sm);display:grid;place-items:center;font-size:12px;color:var(--stone)">--shadow-sm</div><div style="flex:1;height:90px;border-radius:14px;background:var(--paper);box-shadow:var(--shadow-md);display:grid;place-items:center;font-size:12px;color:var(--stone)">--shadow-md</div><div style="flex:1;height:90px;border-radius:14px;background:var(--paper);box-shadow:var(--shadow-lg);display:grid;place-items:center;font-size:12px;color:var(--stone)">--shadow-lg</div><div style="flex:1;height:90px;border-radius:14px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--stone)">border only (default)</div></div></body></html>
