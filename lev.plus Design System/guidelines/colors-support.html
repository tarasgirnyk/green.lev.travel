<!-- @dsCard group="Colors" viewport="700x130" name="Support & status" subtitle="Ochre-ink for text, neutrals, plot statuses" -->
<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)}</style></head><body><div style="display:flex;height:130px"><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:var(--ochre-ink);color:#F2EDE3;min-height:120px"><b style="font-size:13px">Ochre-ink</b><span style="font-size:11px;opacity:.85;font-family:ui-monospace,monospace">#7A5C24</span><span style="font-size:10px;opacity:.8;margin-top:4px">text accent on linen</span></div><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:var(--paper);color:#1C1E1B;min-height:120px"><b style="font-size:13px">Paper</b><span style="font-size:11px;opacity:.85;font-family:ui-monospace,monospace">#FBF8F2</span><span style="font-size:10px;opacity:.8;margin-top:4px">cards</span></div><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:var(--linen-2);color:#1C1E1B;min-height:120px"><b style="font-size:13px">Linen-2</b><span style="font-size:11px;opacity:.85;font-family:ui-monospace,monospace">#E9E2D4</span><span style="font-size:10px;opacity:.8;margin-top:4px">sunken</span></div><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:var(--stone);color:#F2EDE3;min-height:120px"><b style="font-size:13px">Stone</b><span style="font-size:11px;opacity:.85;font-family:ui-monospace,monospace">#5C6158</span><span style="font-size:10px;opacity:.8;margin-top:4px">muted text</span></div><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:var(--line);color:#1C1E1B;min-height:120px"><b style="font-size:13px">Line</b><span style="font-size:11px;opacity:.85;font-family:ui-monospace,monospace">#D8CFBE</span><span style="font-size:10px;opacity:.8;margin-top:4px">borders</span></div><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:var(--status-sold);color:#1C1E1B;min-height:120px"><b style="font-size:13px">Sold</b><span style="font-size:11px;opacity:.85;font-family:ui-monospace,monospace">#8A8F86</span><span style="font-size:10px;opacity:.8;margin-top:4px">status</span></div><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:var(--danger);color:#F2EDE3;min-height:120px"><b style="font-size:13px">Danger</b><span style="font-size:11px;opacity:.85;font-family:ui-monospace,monospace">#A4442F</span><span style="font-size:10px;opacity:.8;margin-top:4px">errors</span></div></div></body></html>
