services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: green_lev
      POSTGRES_USER: green_lev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_BIND_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U green_lev -d green_lev"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ${SHARED_MAIL_ENV_FILE:-.env.mail}
        required: false
      - path: .env
        required: true
    environment:
      DATABASE_URL: postgresql://green_lev:${POSTGRES_PASSWORD}@db:5432/green_lev
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-3000}:3000"
volumes:
  postgres_data:
