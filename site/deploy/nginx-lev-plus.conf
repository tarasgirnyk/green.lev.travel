server {
    listen 80;
    listen [::]:80;
    server_name lev.plus www.lev.plus;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://lev.plus$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lev.plus www.lev.plus;

    ssl_certificate     /etc/letsencrypt/live/lev.plus/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lev.plus/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LevPlusSSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Тимчасово закрито: сайт у розробці. Користувачі — /etc/nginx/.htpasswd-lev-plus
    auth_basic "lev.plus";
    auth_basic_user_file /etc/nginx/.htpasswd-lev-plus;

    client_max_body_size 25m;

    if ($host = www.lev.plus) {
        return 308 https://lev.plus$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
