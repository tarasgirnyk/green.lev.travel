# Продакшн на сервері: /opt/lev-plus. Образ lev-plus-site збирається локально (див. deploy/README.md).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: levplus
      POSTGRES_USER: levplus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U levplus -d levplus']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: lev-plus-site:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://levplus:${POSTGRES_PASSWORD}@db:5432/levplus
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: https://lev.plus
    ports:
      - '127.0.0.1:3500:3000'
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
